databases:
  - name: portfolio-db
    databaseName: portfolio
    user: portfolio
    plan: free

services:
  - type: web
    name: django-portfolio
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

    # Para conservar las imágenes subidas desde el admin, configurá un storage
    # S3-compatible con estas variables (ver README → "Archivos subidos (media)"):
    #   - key: DJANGO_STORAGE_BACKEND
    #     value: "s3"
    #   - key: AWS_STORAGE_BUCKET_NAME
    #     value: "nombre-del-bucket"
    #   - key: AWS_ACCESS_KEY_ID
    #     sync: false
    #   - key: AWS_SECRET_ACCESS_KEY
    #     sync: false
    #   - key: AWS_S3_REGION_NAME
    #     value: "auto"
    #   - key: AWS_S3_ENDPOINT_URL
    #     value: "https://<account>.r2.cloudflarestorage.com"
    #
    # Alternativa en planes pagos: disco persistente y descomentá estas líneas:
    #
    # disk:
    #   name: media
    #   mountPath: /var/data
    #   sizeGB: 1
    #
    # Después agregá esta variable dentro de envVars:
    #   - key: DJANGO_MEDIA_ROOT
    #     value: /var/data/media
