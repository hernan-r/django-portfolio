<li class="skill-item">
  <div class="skill-head">
    <span class="skill-name">
      {% if skill.icon %}<span class="skill-icon" aria-hidden="true">{{ skill.icon }}</span>{% endif %}
      {{ skill.name }}
    </span>
    <span class="skill-level">{{ skill.level }}%</span>
  </div>
  <div class="skill-track" role="progressbar" aria-label="Nivel de {{ skill.name }}" aria-valuenow="{{ skill.level }}" aria-valuemin="0" aria-valuemax="100">
    <span class="skill-fill" style="--level: {{ skill.level }}%"></span>
  </div>
</li>
